# Configuration d'argocd-image-updater.
#
# Depuis la v1.0.0, l'outil ne lit plus les annotations
# argocd-image-updater.argoproj.io/* portees par les Application : la
# configuration vit dans cette ressource ImageUpdater. Les annotations
# equivalentes ont ete retirees d'apps/plex.yaml et apps/qbittorrent.yaml.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: media-stack
  namespace: argocd
  annotations:
    # Apres les Application qu'elle reference (elles sont en vague 2).
    argocd.argoproj.io/sync-wave: "3"
spec:
  # Ecriture dans Git et non via l'API ArgoCD : le depot reste la source de
  # verite, et selfHeal ne peut pas annuler la montee de version.
  # Authentification par deploy key SSH (ecriture, ce seul depot), plus par
  # PAT. Le secret argocd/git-creds-ssh (cree a la main, jamais versionne)
  # porte sshPrivateKey et insecure=false : la cle d'hote est verifiee contre
  # argocd-ssh-known-hosts-cm, monte dans /app/config/ssh.
  writeBackConfig:
    method: "git:secret:argocd/git-creds-ssh"
    gitConfig:
      # L'Application lit le depot public en HTTPS sans identifiants ; seule
      # l'ecriture passe par SSH, d'ou cette URL distincte de repoURL.
      repository: "git@github.com:muchiny/media-stack-k8s.git"
      branch: main
      writeBackTarget: "helmvalues:values.yaml"
  applicationRefs:
    - namePattern: plex
      images:
        - alias: plex
          imageName: lscr.io/linuxserver/plex
          commonUpdateSettings:
            # Tags immuables linuxserver (1.43.5.11079-b3b13e506-ls331) : non
            # semver (4 nombres), donc tri par date de build. Majeure figee a 1.
            # Plancher ls331 : newest-build n'a aucune garde anti-retour et un
            # 429 de ghcr pendant la lecture des metadonnees retire des tags.
            updateStrategy: newest-build
            # yamllint disable-line rule:line-length
            allowTags: 'regexp:^1\.[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]+-ls(33[1-9]|3[4-9][0-9]|[4-9][0-9]{2}|[1-9][0-9]{3,})$'
            platforms:
              - linux/arm64
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
    - namePattern: qbittorrent
      images:
        - alias: qbittorrent
          # Image officielle : tags <qbittorrent>-<revision d'image> (5.3.0-2),
          # libtorrent 2.1. Le tag de imageName est la contrainte semver.
          # Pour semver, "-2" est une pre-version : la contrainte doit porter
          # elle-meme un suffixe (-0) pour les accepter. Majeure figee a 5.
          # Teste le 2026-11-07 (/manager test) : 5.2.0-1 -> 5.3.0-2,
          # 5.1.4-1 -> 5.1.4-2.
          imageName: ghcr.io/qbittorrent/docker-qbittorrent-nox:^5.0.0-0
          commonUpdateSettings:
            # semver ne lit que la liste des tags, sans date de build : un 429
            # de ghcr ne peut plus provoquer de retour arriere (plancher
            # inutile). L'expression ecarte latest, alpha et -lt1- (libtorrent
            # 1.2) ainsi que les anciens -lt2-.
            updateStrategy: semver
            allowTags: 'regexp:^5\.[0-9]+\.[0-9]+-[0-9]+$'
            platforms:
              - linux/arm64
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
