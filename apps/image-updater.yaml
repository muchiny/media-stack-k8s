# Configuration d'argocd-image-updater.
#
# Depuis la v1.0.0, l'outil ne lit plus les annotations
# argocd-image-updater.argoproj.io/* portees par les Application : la
# configuration vit dans cette ressource ImageUpdater. Les annotations
# equivalentes ont ete retirees d'apps/plex.yaml et apps/qbittorrent.yaml.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: media-stack
  namespace: argocd
  annotations:
    # Apres les Application qu'elle reference (elles sont en vague 2).
    argocd.argoproj.io/sync-wave: "3"
spec:
  # Ecriture dans Git et non via l'API ArgoCD : le depot reste la source de
  # verite, et selfHeal ne peut pas annuler la montee de version.
  writeBackConfig:
    method: "git:secret:argocd/git-creds"
    gitConfig:
      branch: main
      writeBackTarget: "helmvalues:values.yaml"
  applicationRefs:
    - namePattern: plex
      images:
        - alias: plex
          imageName: lscr.io/linuxserver/plex
          commonUpdateSettings:
            # Tags immuables linuxserver (1.43.5.11079-b3b13e506-ls331) : non
            # semver (4 nombres), donc tri par date de build. Majeure figee a 1.
            # Plancher ls331 : newest-build n'a aucune garde anti-retour et un
            # 429 de ghcr pendant la lecture des metadonnees retire des tags.
            updateStrategy: newest-build
            # yamllint disable-line rule:line-length
            allowTags: 'regexp:^1\.[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]+-ls(33[1-9]|3[4-9][0-9]|[4-9][0-9]{2}|[1-9][0-9]{3,})$'
            platforms:
              - linux/arm64
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
    - namePattern: qbittorrent
      images:
        - alias: qbittorrent
          imageName: lscr.io/linuxserver/qbittorrent
          commonUpdateSettings:
            # Tags immuables <qbittorrent>_v<libtorrent>-lsNNN, tries par date
            # de build. Majeures figees (qBittorrent 5, libtorrent 2) ; ecarte
            # libtorrentv1, unstable, beta/rc et les tags calendaires 20.xx.
            # Plancher ls486 (meme raison que plex).
            updateStrategy: newest-build
            allowTags: 'regexp:^5\.[0-9]+\.[0-9]+_v2\.[0-9]+\.[0-9]+-ls(48[6-9]|49[0-9]|[5-9][0-9]{2}|[1-9][0-9]{3,})$'
            platforms:
              - linux/arm64
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
