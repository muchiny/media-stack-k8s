apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/muchiny/media-stack-k8s.git
    targetRevision: HEAD
    path: charts/sonarqube
    helm:
      releaseName: sonarqube
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    # Namespace dedie : SonarQube n'est pas de la stack media et ne doit pas
    # consommer le ResourceQuota ni les PriorityClass de media-stack.
    namespace: sonarqube
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
