apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "backup.fullname" . }}
  labels:
    {{- include "backup.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "backup.selectorLabels" . | nindent 8 }}
    spec:
      template:
        metadata:
          labels:
            {{- include "backup.selectorLabels" . | nindent 12 }}
        spec:
          {{- if .Values.priorityClassName }}
          priorityClassName: {{ .Values.priorityClassName }}
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # runAsUser: 0 + DAC_READ_SEARCH n'etaient necessaires que pour
              # lire la config root de Home Assistant, retire le 2026-08-09
              # (service mort depuis le 14 fevrier). Les configs restantes
              # appartiennent a l'uid 1000, et le seul dossier root subsistant
              # (qBittorrent/data) est en 755 donc traversable.
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="{{ .Values.backup.destPath }}/media-config-${TIMESTAMP}.tar.gz"
                  echo "Starting backup at ${TIMESTAMP}"
                  echo "Source: {{ .Values.backup.sourcePath }}"
                  echo "Destination: ${BACKUP_FILE}"
                  tar -czf "${BACKUP_FILE}" -C "$(dirname {{ .Values.backup.sourcePath }})" "$(basename {{ .Values.backup.sourcePath }})"
                  echo "Backup created: $(ls -lh ${BACKUP_FILE})"
                  # Rotation PAR DATE et non par nombre. L'ancienne version
                  # gardait les N plus recentes : quatre executions manuelles le
                  # 2026-08-09 ont suffi a chasser les sauvegardes du 3 au 6 aout
                  # hors de la fenetre. Une retention en jours resiste aux tests.
                  echo "Cleaning up backups older than {{ .Values.backup.retentionDays }} days..."
                  find {{ .Values.backup.destPath }} -maxdepth 1 -name 'media-config-*.tar.gz' \
                    -mtime +{{ .Values.backup.retentionDays }} -print -delete
                  # Garde-fou : conserver au minimum la derniere sauvegarde, meme
                  # si elle a depasse la retention (machine eteinte longtemps).
                  if [ -z "$(ls -1 {{ .Values.backup.destPath }}/media-config-*.tar.gz 2>/dev/null)" ]; then
                    echo "ATTENTION : plus aucune archive apres rotation"
                  fi
                  echo "Remaining backups:"
                  ls -lht {{ .Values.backup.destPath }}/media-config-*.tar.gz
                  echo "Backup completed successfully"
              volumeMounts:
                - name: source
                  mountPath: {{ .Values.backup.sourcePath }}
                  readOnly: true
                - name: dest
                  mountPath: {{ .Values.backup.destPath }}
          volumes:
            - name: source
              hostPath:
                path: {{ .Values.backup.sourcePath }}
                type: Directory
            - name: dest
              hostPath:
                path: {{ .Values.backup.destPath }}
                type: DirectoryOrCreate
