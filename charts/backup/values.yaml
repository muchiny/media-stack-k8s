image:
  repository: alpine
  tag: "3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a"
  pullPolicy: IfNotPresent

schedule: "0 3 * * *"

backup:
  sourcePath: /home/muchini/media-data/config
  destPath: /home/muchini/backups
  # Retention en JOURS (et non en nombre d'archives) : une execution manuelle
  # ne chasse plus une sauvegarde quotidienne hors de la fenetre.
  retentionDays: 7

resources:
  limits:
    memory: 128Mi
    cpu: 200m
  requests:
    memory: 64Mi
    cpu: 50m

priorityClassName: media-normal

nodeSelector:
  kubernetes.io/arch: arm64
