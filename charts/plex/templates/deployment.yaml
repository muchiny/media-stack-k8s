apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plex.fullname" . }}
  labels:
    {{- include "plex.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "plex.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "plex.selectorLabels" . | nindent 8 }}
    spec:
      # Le pod n'appelle jamais l'API Kubernetes : pas de jeton monte.
      automountServiceAccountToken: false
      hostNetwork: {{ .Values.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # Filtre seccomp par defaut de containerd. Sans lui le pod tournait
        # en "Unconfined" (Seccomp: 0 dans /proc/<pid>/status).
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          - name: ndots
            value: "2"
          - name: timeout
            value: "5"
          - name: attempts
            value: "3"
      terminationGracePeriodSeconds: 120
      containers:
        - name: plex
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- range $key, $value := .Values.environment }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - containerPort: 32400
              hostPort: 32400
              protocol: TCP
              name: plex
          volumeMounts:
            - name: config
              mountPath: {{ .Values.persistence.config.mountPath }}
            - name: media
              mountPath: {{ .Values.persistence.media.mountPath }}
              readOnly: {{ .Values.persistence.media.readOnly }}
            - name: transcode
              mountPath: {{ .Values.persistence.transcode.mountPath }}
            {{- if .Values.gpu.enabled }}
            - name: dri
              mountPath: /dev/dri
            {{- end }}
          {{- if .Values.gpu.enabled }}
          securityContext:
            privileged: true
          {{- else }}
          # Jeu minimal mesure le 2026-11-04 (podman, profil seccomp de
          # containerd). L'init s6 de linuxserver tourne en root, Plex tourne
          # en abc (1000) sans aucune capability :
          #  - CHOWN : lsiown remet /app et /run/plex-temp (TMPDIR de Plex) a
          #    abc ; sans lui Plex n'ecrit plus dans son TMPDIR
          #  - SETGID, SETUID : s6-setuidgid abc ; sans eux Plex ne demarre pas
          #  - KILL : s6-supervise (root) doit envoyer SIGTERM a Plex (uid
          #    1000). Sans lui Plex est tue en SIGKILL au bout du delai de
          #    grace (base SQLite fermee sans "Database: Shutting down").
          # Ports tous >= 1024 (32400, 32401, 1901/udp, 32410-32414/udp) :
          # NET_BIND_SERVICE inutile, meme en hostNetwork.
          # DAC_OVERRIDE volontairement absent : l'init ne peut plus lire
          # Preferences.xml (600) ni effacer un plexmediaserver.pid perime.
          # Messages sans effet ("Preferences.xml: Permission denied",
          # "Server is unclaimed", "rm: cannot remove ...pid") : Plex
          # demarre quand meme, teste avec un pid perime.
          # Ne jamais definir PLEX_CLAIM avec ce jeu : sans DAC, init-plex-claim
          # ne lit pas Preferences.xml, croit le serveur non revendique et
          # consommerait le jeton sans pouvoir l'ecrire.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - KILL
                - SETGID
                - SETUID
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /web/index.html
              port: 32400
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /web/index.html
              port: 32400
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /web/index.html
              port: 32400
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
      volumes:
        - name: config
          hostPath:
            path: {{ .Values.persistence.config.hostPath }}
            type: DirectoryOrCreate
        - name: media
          hostPath:
            path: {{ .Values.persistence.media.hostPath }}
            type: Directory
        - name: transcode
          emptyDir:
            medium: {{ .Values.persistence.transcode.medium | default "" }}
            {{- if .Values.persistence.transcode.sizeLimit }}
            sizeLimit: {{ .Values.persistence.transcode.sizeLimit }}
            {{- end }}
        {{- if .Values.gpu.enabled }}
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        {{- end }}
