replicaCount: 1
image:
  repository: lscr.io/linuxserver/plex
  tag: 1.43.5.11079-b3b13e506-ls331
  pullPolicy: IfNotPresent
hostNetwork: true
# Desactive le 2026-11-03 : le Pi 5 n'a pas d'encodeur video materiel
# (/dev/dri = GPU 3D v3d + affichage vc4) et Plex ne sait transcoder en
# materiel qu'avec Intel/NVIDIA/AMD. Plex n'ouvrait jamais /dev/dri ; ce
# drapeau ne servait qu'a rendre le conteneur privileged (kubernetes:S6428).
# A true, le conteneur repasse privileged et perd tout le durcissement
# (drop ALL, allowPrivilegeEscalation: false) : privileged les annule.
gpu:
  enabled: false
persistence:
  config:
    hostPath: /home/muchini/media-data/config/plex
    mountPath: /config
  media:
    hostPath: /media
    mountPath: /media
    readOnly: true
  transcode:
    type: emptyDir
    mountPath: /transcode
    medium: Memory
    sizeLimit: 256Mi
environment:
  PUID: "1000"
  PGID: "1000"
  TZ: Europe/Paris
  VERSION: docker
resources:
  limits:
    memory: 4Gi
    # Disque local du conteneur (rootfs + logs) : ~1 Mi mesure le
    # 2026-11-03. La limite protege le / du Pi, la requete classe le pod
    # parmi les derniers expulses en cas de DiskPressure (cf. 26/09).
    ephemeral-storage: 1Gi
    cpu: 3500m
  requests:
    ephemeral-storage: 64Mi
    memory: 1Gi
    cpu: 1000m
priorityClassName: media-high
nodeSelector:
  kubernetes.io/arch: arm64
service:
  type: ClusterIP
  port: 32400
networkPolicy:
  enabled: true
ingress:
  enabled: true
  host: plex.local
