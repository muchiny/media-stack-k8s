apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qbittorrent.fullname" . }}
  labels:
    {{- include "qbittorrent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "qbittorrent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qbittorrent.selectorLabels" . | nindent 8 }}
    spec:
      # Le pod n'appelle jamais l'API Kubernetes : pas de jeton monte.
      automountServiceAccountToken: false
      # DNS du cluster par defaut (CoreDNS -> /etc/resolv.conf de l'hote)
      dnsPolicy: ClusterFirst
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # Filtre seccomp par defaut de containerd. Sans lui le pod tournait
        # en "Unconfined" (Seccomp: 0 dans /proc/<pid>/status).
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      dnsConfig:
        options:
          - name: ndots
            value: "2"
          - name: timeout
            value: "5"
          - name: attempts
            value: "3"
      initContainers:
        # Attend que le DNS du cluster (CoreDNS) reponde
        - name: wait-for-dns
          image: "{{ .Values.initContainer.image.repository }}:{{ .Values.initContainer.image.tag }}"
          # nslookup + sleep : ni root, ni capability, ni ecriture. 65534 =
          # nobody de busybox (uid numerique exige par runAsNonRoot, l'image
          # declarant root par defaut).
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              memory: 32Mi
              cpu: 50m
            requests:
              memory: 16Mi
              cpu: 10m
          command:
            - sh
            - -c
            - |
              # On attend que le DNS du cluster reponde, pas qu'un service
              # particulier existe. L'ancienne version attendait
              # media-dnscrypt-proxy, qui n'a jamais recu la moindre requete
              # (CoreDNS forwarde vers /etc/resolv.conf) : une dependance morte
              # qui a bloque ce pod 3858 fois pendant la panne de juillet.
              echo "Attente du DNS du cluster..."
              ATTEMPTS=0
              MAX_ATTEMPTS=24
              until nslookup kubernetes.default.svc.cluster.local; do
                ATTEMPTS=$((ATTEMPTS + 1))
                if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
                  echo "DNS indisponible apres 2 minutes, abandon"
                  exit 1
                fi
                echo "DNS pas encore pret, attente... ($ATTEMPTS/$MAX_ATTEMPTS)"
                sleep 5
              done
              echo "DNS operationnel."
      containers:
        - name: qbittorrent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Image officielle (depuis le 2026-11-07, avant : linuxserver) : pas
          # d'init s6. Lance hors root, /entrypoint.sh execute directement
          # qbittorrent-nox (sous tini) : ni chown, ni changement d'uid, donc
          # aucune capability. Verifie sous podman (uid 1000, cap-drop all,
          # rootfs en lecture seule, profil --profile=/config) : 5/5 torrents
          # restaures, arret propre avec sauvegarde des donnees de reprise (tini
          # relaie SIGTERM au meme uid : KILL n'est plus necessaire).
          # 1000 = qbtUser de l'image = muchini, proprietaire des hostPath.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            {{- range $key, $value := .Values.environment }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - containerPort: 8080
              hostPort: 8080
              protocol: TCP
              name: webui
            # hostPort indispensable pour etre joignable par les pairs :
            # qBittorrent annonce le port 6881 aux trackers, or seul le
            # NodePort 30881 etait ouvert sur la machine. Les pairs tentaient
            # donc 6881 et tombaient dans le vide (mode "firewalled").
            # A completer par une redirection 6881 TCP+UDP sur la box.
            - containerPort: 6881
              hostPort: 6881
              protocol: TCP
              name: torrent-tcp
            - containerPort: 6881
              hostPort: 6881
              protocol: UDP
              name: torrent-udp
          volumeMounts:
            - name: config
              mountPath: {{ .Values.persistence.config.mountPath }}
            - name: downloads
              mountPath: {{ .Values.persistence.downloads.mountPath }}
            - name: media
              mountPath: {{ .Values.persistence.media.mountPath }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
      volumes:
        - name: config
          hostPath:
            path: {{ .Values.persistence.config.hostPath }}
            type: DirectoryOrCreate
        - name: downloads
          hostPath:
            path: {{ .Values.persistence.downloads.hostPath }}
            type: DirectoryOrCreate
        - name: media
          hostPath:
            path: {{ .Values.persistence.media.hostPath }}
            type: Directory
