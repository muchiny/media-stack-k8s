{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "qbittorrent.fullname" . }}
  labels:
    {{- include "qbittorrent.labels" . | nindent 4 }}
spec:
  # HTTPS uniquement : en HTTP le mot de passe passerait en clair.
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      services:
        - name: {{ include "qbittorrent.fullname" . }}-webui
          port: {{ .Values.service.webui.port }}
          # qBittorrent refuse un Host dont le port differe du sien (8080) :
          # avec le Host d'origine (qbit.local:30453), il repondait 401.
          passHostHeader: false
{{- end }}
