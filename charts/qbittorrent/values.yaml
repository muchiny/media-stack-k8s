replicaCount: 1
image:
  repository: lscr.io/linuxserver/qbittorrent
  tag: 5.3.0_v2.1.2-ls486
  pullPolicy: IfNotPresent
initContainer:
  image:
    repository: busybox
    tag: "1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4"
service:
  webui:
    type: NodePort
    port: 8080
    nodePort: 30080
  torrent:
    type: NodePort
    port: 6881
    nodePort: 30881
persistence:
  config:
    hostPath: /home/muchini/media-data/config/qbittorrent
    mountPath: /config
  downloads:
    hostPath: /home/muchini/media-data/torrents
    mountPath: /downloads
  media:
    hostPath: /media
    mountPath: /media
  session:
    hostPath: /home/muchini/media-data/config/qbittorrent/session
    mountPath: /config/qBittorrent/data
environment:
  PUID: "1000"
  PGID: "1000"
  TZ: Europe/Paris
  WEBUI_PORT: "8080"
resources:
  limits:
    memory: 1Gi
    # Disque local du conteneur (rootfs + logs) : ~1 Mi mesure le
    # 2026-11-03. La limite protege le / du Pi, la requete classe le pod
    # parmi les derniers expulses en cas de DiskPressure (cf. 26/09).
    ephemeral-storage: 1Gi
    cpu: 1000m
  requests:
    ephemeral-storage: 64Mi
    memory: 256Mi
    cpu: 100m
priorityClassName: media-high
nodeSelector:
  kubernetes.io/arch: arm64
networkPolicy:
  enabled: true
ingress:
  enabled: true
  host: qbit.local
