# SonarQube Cloud, analyse par le job `sonar` de .github/workflows/validate.yaml.
# Analyse pilotee par la CI : garder l'Automatic Analysis desactivee
# (Administration > Analysis Method), les deux methodes sont en conflit.
sonar.organization=muchiny
sonar.projectKey=muchiny_media-stack-k8s
sonar.projectName=media-stack-k8s
sonar.sourceEncoding=UTF-8

# Perimetre : les Applications ArgoCD, le namespace, les charts Helm
# (regles Kubernetes/Helm), le Corefile et les workflows (regles GitHub
# Actions). Les README/CHANGELOG ne sont pas du code.
sonar.sources=apps,base,charts,k3s,.github
sonar.exclusions=**/*.md,**/templates/secret.yaml

# Depot sans code applicatif ni tests : aucun rapport de couverture.
# Sans cette exclusion, tout compterait pour 0 % et ferait echouer la
# quality gate.
sonar.coverage.exclusions=**/*
